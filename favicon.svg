<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Navy background -->
  <rect width="100" height="100" rx="16" fill="#1e3a5f"/>

  <!-- Left margin line -->
  <line x1="20" y1="10" x2="20" y2="90" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Outer Door Frame -->
  <rect x="25" y="10" width="55" height="80" rx="3" stroke="#ffffff" stroke-width="4.5" fill="none"/>

  <!-- Inner Open Door Perspective Lines -->
  <polyline points="25,14 52,23 52,34" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Keyhole: circle top + trapezoid -->
  <path d="M 42,44 A 7,7 0 1,1 54,44 L 57,63 L 39,63 Z" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key loop handle -->
  <circle cx="74" cy="44" r="7" stroke="#ffffff" stroke-width="3.5" fill="none"/>

  <!-- Key shaft -->
  <line x1="46" y1="44" x2="67" y2="44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Key teeth -->
  <line x1="49" y1="44" x2="49" y2="50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="54" y1="44" x2="54" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- NJAP text -->
  <text x="52.5" y="82" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">NJAP</text>
</svg>
