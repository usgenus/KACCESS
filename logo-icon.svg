<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Left double frame margin line -->
  <line x1="20" y1="12" x2="20" y2="88" stroke="currentColor" stroke-width="3" />
  
  <!-- Outer Door Frame -->
  <rect x="25" y="12" width="55" height="76" rx="2" stroke="currentColor" stroke-width="3.5" fill="none" />
  
  <!-- Inner Open Door Perspective Lines -->
  <polyline points="25,16 52,25 52,36" stroke="currentColor" stroke-width="3.2" />
  
  <!-- Keyhole: Top Circle + Bottom Trapezoid Flange -->
  <path d="M 43,45 A 7,7 0 1,1 53,45 L 56,64 L 40,64 Z" stroke="currentColor" stroke-width="3.2" fill="none" />
  
  <!-- Key: Right Loop Handle + Shaft + Teeth entering Keyhole -->
  <!-- Key loop handle -->
  <circle cx="74" cy="45" r="6.5" stroke="currentColor" stroke-width="3.2" fill="none" />
  <!-- Key shaft -->
  <line x1="47" y1="45" x2="67.5" y2="45" stroke="currentColor" stroke-width="3.2" />
  <!-- Key teeth -->
  <line x1="49" y1="45" x2="49" y2="49" stroke="currentColor" stroke-width="3.2" />
  <line x1="53" y1="45" x2="53" y2="48" stroke="currentColor" stroke-width="2.8" />
  
  <!-- NJAP Typography -->
  <text x="52.5" y="81" font-family="'Times New Roman', 'Noto Serif KR', serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="currentColor" stroke="none" text-anchor="middle">NJAP</text>
</svg>
